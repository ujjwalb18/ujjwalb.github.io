<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujjwal Bhardwaj — Data Analyst &amp; Software Engineer</title>
  <meta name="description" content="Ujjwal Bhardwaj — Data Analyst &amp; Software Engineer. MDS from University of Adelaide, 2.5+ yrs enterprise experience spanning incident response, ServiceNow, and Power BI reporting. Building pipelines, dashboards, and systems that ship." />

  <!-- favicon (uses the avatar as a small profile icon) -->
  <link rel="icon" type="image/png" href="assets/avatar.png" />

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Bricolage+Grotesque:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- styles, in cascade order -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />
</head>
<body>

  <!-- shown until JS finishes loading + rendering components, then removed -->
  <div id="preloader" aria-hidden="true">
    <span class="preloader-text">booting<span class="preloader-dots">...</span></span>
  </div>

  <!-- ============================================
       Each <div data-component="X"> placeholder
       is replaced at runtime by /components/X.html
       ============================================ -->

  <div data-component="topbar"></div>

  <div class="ide">
    <div data-component="sidebar"></div>

    <main class="main">
      <div data-component="tabs"></div>
      <div data-component="hero"></div>
      <div data-component="about"></div>
      <div data-component="skills"></div>
      <div data-component="projects"></div>
      <div data-component="terminal"></div>
      <div data-component="contact"></div>
      <div data-component="footer"></div>
    </main>
  </div>

  <!-- floating sticker + popup (outside ide grid so it overlays) -->
  <div data-component="sticker"></div>

  <!-- one-time nudge pointing at the terminal, shown after the preloader clears -->
  <div class="terminal-toast" id="terminalToast" hidden>
    <button class="terminal-toast-close" id="terminalToastClose" aria-label="Dismiss">×</button>
    <a href="#terminal" class="terminal-toast-body" id="terminalToastLink">
      <span class="hl">$_</span> psst — the terminal below actually works. try <span class="hl">help</span> or <span class="hl">impact</span>
    </a>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
